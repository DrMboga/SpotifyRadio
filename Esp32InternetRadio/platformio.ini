; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = az-delivery-devkit-v4

[env:az-delivery-devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
upload_port = COM3
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder
board_build.partitions = partitions_radio.csv
board_build.filesystem = littlefs
build_src_filter = +<*> -<ToneTest.cpp>
build_flags = 
	-DARDUINO_RUNNING_CORE=0
	-DCORE_DEBUG_LEVEL=3
	
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DST7735_BLACKTAB
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=5
	-DTFT_DC=21
	-DTFT_RST=4
	-DTFT_MISO=-1
	-DSPI_FREQUENCY=27000000
	-DDISABLE_ALL_LIBRARY_WARNINGS=1
build_src_flags = 
	-Wall
	-Wextra
	-Wno-sign-compare
lib_deps = 
	https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
	bodmer/TFT_eSPI@2.5.43

[env:tone-test]
extends = env:az-delivery-devkit-v4
build_src_filter = -<*> +<ToneTest.cpp>
