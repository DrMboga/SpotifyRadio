; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Plain `pio run` builds only the radio firmware; the tone test is opt-in.
default_envs = az-delivery-devkit-v4

[env:az-delivery-devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino

upload_port=COM3
; The board default is 460800, which drops connections part-way through a
; write on marginal USB cables. 115200 is a few seconds slower and reliable.
upload_speed = 115200
monitor_port = COM3
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; Custom flash layout — see partitions_radio.csv and D6. The filesystem holds
; stations.csv + logos and is uploaded separately with `pio run -t uploadfs`.
board_build.partitions = partitions_radio.csv
board_build.filesystem = littlefs

; ToneTest.cpp has its own setup()/loop() and belongs to the tone-test env only.
build_src_filter = +<*> -<ToneTest.cpp>

build_flags =
    ; D14: Arduino's loop() defaults to core 1. Move it to core 0 so core 1
    ; belongs to the audio task alone.
    -DARDUINO_RUNNING_CORE=0
    ; Info-level core logging during bring-up. Drop to 1 (errors) if the serial
    ; chatter ever gets in the way of the audio timing.
    -DCORE_DEBUG_LEVEL=3

; Warnings for this project's own sources only. `build_flags` would apply them
; to the Arduino framework and ESP32-audioI2S as well, which bury real findings
; under thousands of lines of third-party noise.
;
; This is not housekeeping. The M2 `[stat]` line passed 14 arguments to 13
; format specifiers for the whole milestone, so it printed the decode-error
; count under the label `rssi=` and dropped the actual signal strength. The
; wrong reading was then recorded in DeliveryPlan.md as a WiFi.RSSI() fault and
; fixed as one. -Wformat catches it in a second.
build_src_flags =
    -Wall
    -Wextra
    ; Nothing in src/ should have an unused parameter, but the Arduino headers
    ; hand us plenty of signed/unsigned comparisons to no purpose.
    -Wno-sign-compare

lib_deps =
    ; D2 — pinned. 3.0.12 is the last release that supports Arduino core 2.x
    ; (ESP-IDF 4.4), which is what this platform version ships. 3.1.0+ requires
    ; Arduino core 3.x / IDF 5 and will not compile here.
    https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12

; Hardware bring-up only: a 440 Hz sine straight out of the I2S peripheral,
; with no WiFi and no audio library. Isolates the DAC and its wiring from
; everything else.
;
;   pio run -e tone-test -t upload
;
[env:tone-test]
extends = env:az-delivery-devkit-v4
build_src_filter = -<*> +<ToneTest.cpp>
